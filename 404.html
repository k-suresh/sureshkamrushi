<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/sk.png">
    <title>Page Not Found | Suresh Kamrushi</title>
    <style>
        :root {
            --bg: #faf9ff;
            --panel: #ffffff;
            --ink: #1b1340;
            --muted: #4b4770;
            --accent: #4f46e5;
            --accent-soft: #e8e6ff;
            --border: rgba(27, 19, 64, 0.12);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(180deg, #faf9ff 0%, #f3f1ff 100%);
            color: var(--ink);
        }
        .card {
            width: min(680px, calc(100% - 32px));
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: 0 16px 40px rgba(27, 19, 64, 0.08);
            padding: 52px 28px;
            text-align: center;
        }
        .badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }
        h1 {
            margin: 0;
            font-size: clamp(3rem, 9vw, 5.5rem);
            line-height: 0.95;
            letter-spacing: -0.06em;
        }
        p {
            margin: 18px auto 0;
            max-width: 540px;
            font-size: 1.08rem;
            line-height: 1.7;
            color: var(--muted);
        }
        .actions {
            margin-top: 28px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 12px 22px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn:hover {
            transform: translateY(-1px);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 12px 26px rgba(79, 70, 229, 0.22);
        }
        .btn-secondary {
            background: #fff;
            color: var(--ink);
            border: 1.5px solid var(--border);
        }
    </style>
</head>
<body>
    <main class="card" aria-labelledby="page-title">
        <div class="badge">404 Error</div>
        <h1 id="page-title">Page not found</h1>
        <p>
            The page you were looking for may have been moved, deleted, or never existed.
            Let’s get you back to the homepage.
        </p>
        <div class="actions">
            <a class="btn btn-primary" href="/">Go to Home</a>
            <a class="btn btn-secondary" href="/about/">About</a>
        </div>
    </main>
</body>
</html>
